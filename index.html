<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="/Flurt/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Flurt - Ứng dụng xem phim trực tuyến hiện đại với tính năng phòng xem chung Watch Party thời gian thực.">
  <meta name="theme-color" content="#080B11">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flurt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flurt - Xem Phim & Watch Party Trực Tuyến</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #080B11;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1E1B4B 0%, #080B11 70%);
      color: #ffffff;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .brand-logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top: 3px solid #8B5CF6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-logo">
      🎬 FLURT
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Đang khởi chạy rạp phim trực tuyến...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
