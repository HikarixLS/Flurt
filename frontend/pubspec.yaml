name: flurt_frontend
description: "Flurt - Modern Movie Streaming Web Application with Watch Party in Flutter Web"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  web_socket_channel: ^3.0.0
  video_player: ^2.9.2
  video_player_web: ^2.3.4
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  pointer_interceptor: ^0.10.1+2
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  cupertino_icons: ^1.0.8
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
