<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="/Flurt/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Flurt - Ứng dụng xem phim trực tuyến hiện đại với tính năng phòng xem chung Watch Party thời gian thực trên Web, Điện thoại và Android TV.">
  <meta name="theme-color" content="#080B11">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flurt Cinema">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flurt - Xem Phim & Phòng Xem Chung Watch Party Đa Nền Tảng</title>
  <link rel="manifest" href="manifest.json">

  <!-- Anime.js for smooth cinema animation & canvas particle effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #080B11;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #1E1B4B 0%, #080B11 75%);
      color: #ffffff;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #anime-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
    }
    .brand-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #FFFFFF, #C4B5FD, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      background: rgba(6, 182, 212, 0.2);
      border: 1px solid rgba(6, 182, 212, 0.5);
      color: #38BDF8;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 6px;
      letter-spacing: 1px;
    }
    .spinner-ring {
      width: 52px;
      height: 52px;
      position: relative;
    }
    .spinner-circle {
      width: 100%;
      height: 100%;
      border: 3px solid rgba(139, 92, 246, 0.15);
      border-top: 3px solid #8B5CF6;
      border-right: 3px solid #06B6D4;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-desc {
      margin-top: 20px;
      font-size: 14px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .feature-tags {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }
    .feature-tag {
      font-size: 11px;
      color: #64748B;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <canvas id="anime-canvas"></canvas>
    <div class="loader-content">
      <div class="brand-box">
        <div class="brand-icon">🎬</div>
        <div class="brand-title">FLURT</div>
        <div class="brand-badge">PARTY</div>
      </div>
      <div class="spinner-ring">
        <div class="spinner-circle"></div>
      </div>
      <div class="loading-desc">Đang khởi chạy Rạp Phim Trực Tuyến & Đồng Bộ Phòng...</div>
      <div class="feature-tags">
        <span class="feature-tag">🍿 Xem Chung 100% Client</span>
        <span class="feature-tag">📺 Hỗ trợ TV & Mobile</span>
        <span class="feature-tag">⚡ Full HD Vietsub</span>
      </div>
    </div>
  </div>

  <script>
    // Particle Animation using Anime.js & Canvas
    (function initAnimeBackground() {
      const canvas = document.getElementById('anime-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const particleCount = 45;
      const colors = ['#8B5CF6', '#06B6D4', '#EC4899', '#A78BFA'];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.5 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: Math.random() * 0.6 + 0.2,
          speedY: -(Math.random() * 0.8 + 0.2),
          speedX: (Math.random() - 0.5) * 0.4
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          if (p.y < 0) p.y = height;
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.color;
          ctx.fill();
        });
        requestAnimationFrame(render);
      }
      render();

      // Anime.js logo pulse
      if (typeof anime !== 'undefined') {
        anime({
          targets: '.brand-icon',
          scale: [1, 1.08, 1],
          duration: 2000,
          easing: 'easeInOutSine',
          loop: true
        });
      }
    })();

    // Remove loading overlay on Flutter first frame
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 600);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
